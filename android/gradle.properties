org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Keep the Kotlin compiler in the Gradle JVM instead of forking a second one
# (this build machine is RAM-constrained).
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# compileSdk 35 — max supported by Termux aapt2 v2.19 (build-tools 34).
android.suppressUnsupportedCompileSdk=35
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
