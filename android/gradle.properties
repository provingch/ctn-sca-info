org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Keep the Kotlin compiler in the Gradle JVM instead of forking a second one
# (this build machine is RAM-constrained).
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# compileSdk 36 ships with the local SDK; silence AGP 8.9's "untested" warning.
android.suppressUnsupportedCompileSdk=36
