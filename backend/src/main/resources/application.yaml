server:
  port: 8080

spring:
  application:
    name: sca-backend

jwt:
  secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-caracteres}
  access-token-minutes: 60
  temp-token-minutes: 5

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/google/oauth/callback}

sca:
  demo-data:
    enabled: ${SCA_LOAD_DEMO_DATA:false}
