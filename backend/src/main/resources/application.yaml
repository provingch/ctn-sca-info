server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  error:
    include-stacktrace: never   # never include stacktrace in error response body
    include-message: never     # never include exception message in response body
    include-binding-errors: never

spring:
  application:
    name: sca-backend

jwt:
  secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-caracteres}
  access-token-minutes: 60
  temp-token-minutes: 5

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/google/oauth/callback}

sca:
  demo-data:
    enabled: ${SCA_LOAD_DEMO_DATA:false}
  activity-logs:
    dir: ${SCA_ACTIVITY_LOGS_DIR:/var/lib/ctn/activity-logs}

gema:
  integration:
    client-id: gema
    api-key: ${GEMA_API_KEY:}          # vacío = integración deshabilitada (todos los /api/integracion/** dan 503)
    allowed-ips: ${GEMA_ALLOWED_IPS:}  # opcional, lista separada por comas; vacío = sin restricción de origen
