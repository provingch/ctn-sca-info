<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b6fef" />
    <link rel="icon" href="/favicon.svg" />
    <title>Sin conexión · SCA</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #0d1322; color: #f6f7fb; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #2a3850; border-top: 4px solid #8ea2ff; border-radius: 18px; background: #172131; box-shadow: 0 22px 55px rgba(0, 0, 0, .25); }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 24px 0 10px; font-size: clamp(1.8rem, 8vw, 2.5rem); }
      p { margin: 0; color: #aebbd0; line-height: 1.6; }
      button { width: 100%; min-height: 46px; margin-top: 24px; border: 0; border-radius: 10px; background: #8ea2ff; color: #101832; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa/icon-192.png" alt="SCA" />
      <h1>Estás sin conexión</h1>
      <p>No pudimos conectar con el sistema. Revisá tu conexión a Internet y volvé a intentarlo.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
