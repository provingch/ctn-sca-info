<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Portal de Usuario</title>
    <style>
        /* 1. Reset y estilos base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        /* 2. Contenedor principal */
        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        /* 3. Cabecera */
        .login-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            padding: 35px 25px;
            text-align: center;
            position: relative;
        }

        .login-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 0.92rem;
            color: #e2e8f0;
            opacity: 0.9;
        }

        /* 4. Formulario y campos de entrada */
        .login-form {
            padding: 35px 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 13px 42px 13px 16px;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        /* Botón del ojito para mostrar/ocultar contraseña */
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #1e293b;
        }

        .toggle-password:focus {
            outline: none;
            color: #2563eb;
        }

        /* 5. Opciones secundarias */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            font-size: 0.86rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1e3c72;
            cursor: pointer;
        }

        .forgot-password {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* 6. Botón de envío */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 60, 114, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #183059, #22427a);
            box-shadow: 0 6px 16px rgba(30, 60, 114, 0.35);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* 7. Diseño responsivo */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-container {
                border-radius: 10px;
            }

            .login-header {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 1.45rem;
            }

            .login-form {
                padding: 25px 20px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">
        <header class="login-header">
            <h1>Iniciar Sesión</h1>
            <p>Ingrese sus credenciales</p>
        </header>

        <form class="login-form" action="#" method="POST" onsubmit="return validarFormulario(event)">
            
            <!-- Campo de Cédula -->
            <div class="form-group">
                <label for="cedula">Número de Cédula de Identidad</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="cedula" 
                        name="cedula" 
                        class="form-control" 
                        required 
                        autocomplete="username"
                        pattern="[0-9]+"
                        title="Por favor, ingresa únicamente números (sin puntos ni espacios)"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="rolLogin">Tipo de usuario</label>
                <select id="rolLogin" class="form-control">
                    <option value="Docente">Docente</option>
                    <option value="Coordinador">Coordinador</option>
                    <option value="Admin">Administración</option>
                </select>
            </div>

            <!-- Campo de Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        required 
                        autocomplete="current-password"
                        minlength="9"
                        title="La contraseña debe tener más de 8 caracteres"
                    >
                    <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePassword()" aria-label="Mostrar contraseña">
                        <!-- Ícono SVG: Ojo normal (Visible) -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Opciones extra -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Recordar mi sesión</span>
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="btn-submit">Iniciar Sesión</button>

        </form>
    </main>

    <script>
        // Función para alternar visibilidad de la contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const toggleBtn = document.getElementById('togglePasswordBtn');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.setAttribute('aria-label', 'Ocultar contraseña');
                // Ícono SVG: Ojo tachado (Oculto)
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                toggleBtn.setAttribute('aria-label', 'Mostrar contraseña');
                // Ícono SVG: Ojo normal (Visible)
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Validación en el lado del cliente
        function validarFormulario(event) {
            event.preventDefault();
            
            const cedulaInput = document.getElementById('cedula').value.trim();
            const passInput = document.getElementById('password').value;
            const rol = document.getElementById('rolLogin').value;

            if (!/^[0-9]+$/.test(cedulaInput)) {
                alert("Por favor, ingresa únicamente números en la cédula");
                return false;
            }

            if (passInput.length < 8) {
                alert("La contraseña debe tener más de 8 caracteres.");
                return false;
            }

            localStorage.setItem('rolUsuario', rol);
            alert("¡Inicio de sesión exitoso! Cédula ingresada: " + cedulaInput);

            window.location.href = `inicio.html?rol=${encodeURIComponent(rol)}`;
            
            return true;
        }
    </script>
</body>
</html>
