<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCA — Sin conexión</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #14233b;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(20, 35, 59, 0.12);
      padding: 32px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0 0 16px; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: #7a1f2b;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sin conexión temporal</h1>
    <p>La app está intentando volver a cargar, pero por ahora no hay acceso a Internet. Reintentá más tarde o volvé al inicio cuando la conexión esté disponible.</p>
    <a href="/inicio">Volver al inicio</a>
  </main>
</body>
</html>
